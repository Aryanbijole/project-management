{% extends "base.html" %}

{% block title %}Edit Custom Role{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1 class="page-title">🔐 Edit Custom Role</h1>
        <p class="page-subtitle">Update role details and permissions</p>
    </div>
</div>

<div class="glass-card">
    <form method="post">

        {% csrf_token %}

        <div class="form-group">
            <label>Role Name</label>
            <input
                type="text"
                name="name"
                class="form-control"
                value="{{ role.name }}"
                required>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea
                name="description"
                class="form-control"
                rows="3">{{ role.description }}</textarea>
        </div>

        <div class="form-divider-heading">📁 Project Permissions</div>

        <div class="permissions-grid">
            <label class="permission-check">
                <input type="checkbox" name="can_create_projects" {% if role.can_create_projects %}checked{% endif %}>
                <span>➕ Create Projects</span>
            </label>

            <label class="permission-check">
                <input type="checkbox" name="can_edit_projects" {% if role.can_edit_projects %}checked{% endif %}>
                <span>✏️ Edit Projects</span>
            </label>
        </div>

        <div class="form-divider-heading">✅ Task Permissions</div>

        <div class="permissions-grid">
            <label class="permission-check">
                <input type="checkbox" name="can_create_tasks" {% if role.can_create_tasks %}checked{% endif %}>
                <span>➕ Create Tasks</span>
            </label>

            <label class="permission-check">
                <input type="checkbox" name="can_edit_tasks" {% if role.can_edit_tasks %}checked{% endif %}>
                <span>✏️ Edit Tasks</span>
            </label>
        </div>

        <div class="form-divider-heading">🤝 Communication</div>

        <div class="permissions-grid">
            <label class="permission-check">
                <input type="checkbox" name="can_upload_files" {% if role.can_upload_files %}checked{% endif %}>
                <span>📎 Upload Files</span>
            </label>

            <label class="permission-check">
                <input type="checkbox" name="can_invite_members" {% if role.can_invite_members %}checked{% endif %}>
                <span>✉️ Invite Members</span>
            </label>
        </div>

        <div class="form-divider-heading">📊 Reports</div>

        <div class="permissions-grid">
            <label class="permission-check">
                <input type="checkbox" name="can_view_reports" {% if role.can_view_reports %}checked{% endif %}>
                <span>📊 View Reports</span>
            </label>

            <label class="permission-check">
                <input type="checkbox" name="can_view_audit_logs" {% if role.can_view_audit_logs %}checked{% endif %}>
                <span>📋 View Audit Logs</span>
            </label>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                Update Role
            </button>

            <a href="{% url 'admin_role_list' %}" class="btn btn-secondary">
                Cancel
            </a>
        </div>

    </form>
</div>

{% endblock %}
